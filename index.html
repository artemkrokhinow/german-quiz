<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Vokabeltrainer: Artikel & Plural</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="liquid-bg"></div>
		<div class="container">
			<div class="main-content">
				<h1>Artikel & Plural Trainer</h1>
				<div id="quiz-grid" class="quiz-grid"></div>
			</div>

			<aside class="sidebar">
				<div class="sticky-content">
					<div class="controls">
						<button id="check-btn">Prüfen</button>
						<button id="reset-btn" onclick="location.reload()">
							Zurücksetzen
						</button>
					</div>

					<div class="add-section">
						<h3>Eigene Wörter hinzufügen</h3>
						<p>
							Format:
							<code>[ { "word": "...", "art": "...", "plu": "..." } ]</code>
						</p>
						<textarea
							id="custom-words-input"
							placeholder='[{"word": "Hand", "art": "die", "plu": "Hände"}]'
						></textarea>
						<button id="add-words-btn">Speichern</button>
						<button id="clear-storage-btn">Standard wiederherstellen</button>
					</div>
				</div>
			</aside>
		</div>
		<script src="script.js"></script>
	</body>
</html>
